schema_version: 1

context:
  name: pyiron_gpl
  version: "0.0.5"
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pyiron-gpl-${{ version }}.tar.gz
  sha256: 1136b2c796f14a34774f01293c885704acafcacc0cdf70b017e09eb9929d380a

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python 3.10.*
    - setuptools
  run:
    - molmod >=1.4.8
    - numpy >=1.20.1
    - pyiron_atomistics >=0.2.8
    - python >=${{ python_min }}
    - spglib >=1.16.1
    - scipy >=1.6.1
    - quickff >=2.2.4
    - tamkin >=1.2.6
    - yaff >=1.4.2

tests:
  - python:
      imports:
        - pyiron_gpl
        - pyiron_gpl.elastic
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: Additional modules for the pyiron IDE licensed under GPLv3
  description: |
    Additional modules for the pyiron IDE licensed under GPLv3
  homepage: https://github.com/pyiron/pyiron_gpl
  repository: https://github.com/pyiron/pyiron_gpl
  documentation: https://github.com/pyiron/pyiron_gpl

extra:
  recipe-maintainers:
    - pyiron-runner
    - jan-janssen
    - pmrv
    - srmnitc
    - niklassiemer
